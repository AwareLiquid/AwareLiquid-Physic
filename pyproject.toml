[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "awareliquid-physics"
version = "0.1.0"
description = "A complete sequence model with physics computation written into the architecture: liquid (LTC) substrate + hard-constraint Hamiltonian head + symplectic integration"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["torch>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools]
packages = ["awareliquid_physics"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "slow: long-running test; deselect with -m \"not slow\"",
    "integration: end-to-end test running a benchmark CLI and auditing its result JSON",
]
